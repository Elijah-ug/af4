services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: af4-api
    restart: unless-stopped
    env_file: ./api/.env
    ports:
      - "3000:3000"
    command: npx nodemon --watch src --ext ts --exec "ts-node src/index.ts"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    container_name: af4-postgres
    restart: always
    environment:
      - POSTGRES_USER=elicom
      # dev
      - POSTGRES_PASSWORD=elicom256
      - POSTGRES_DB=chat
      # - POSTGRES_PASSWORD=MyvJ5cuwLSlgzlyslOg2QF3S37N7bGPN
      # - POSTGRES_DB=chat_ds41
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elicom"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: af4-ui
    restart: unless-stopped
    env_file:
      - ./ui/.env
    ports:
      - "8080:80"
    volumes:
      - ./ui:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
